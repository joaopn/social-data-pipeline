{% extends "layout.html" %}
{% set title = "Log in" %}
{% block body %}
<main class="login card">
  <h1 class="brand">SDP</h1>
  <p class="muted small">Log in with the management password (set in a terminal with <code>python sdp.py broker passwd</code>).</p>
  {%- if line %}
  <p class="notice" role="alert">{{ line }}</p>
  {%- endif %}
  <form method="post" action="/login">
    <label>Management password
      <input type="password" name="password" autocomplete="current-password" required autofocus>
    </label>
    <button type="submit" class="btn primary">Log in</button>
  </form>
</main>
{% endblock %}
